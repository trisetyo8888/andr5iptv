name: Update IPTV Playlist

on:
  schedule:
    - cron: '0 */6 * * *' # Otomatis berjalan setiap 6 jam
  workflow_dispatch: # Mengaktifkan tombol manual "Run workflow" di tab Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # PERBAIKAN MUTLAK: Menggunakan repositori setup-python yang resmi dan benar
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Scraper Script
      run: python nama_skrip_anda.py # GANTI dengan nama file python Anda (misal: main.py atau scraper.py)

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"
        
        # Daftarkan file playlist.m3u ke dalam pelacakan Git
        git add playlist.m3u
        
        # Validasi perubahan konten sebelum melakukan push
        if git diff --staged --quiet; then
          echo "Konten playlist masih sama dengan versi sebelumnya. Melewati commit."
        else
          git commit -m "Otomatis memperbarui playlist.m3u [Live TV Only]"
          git push origin HEAD:${{ github.ref_name }}
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
